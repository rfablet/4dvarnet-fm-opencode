# @package _global_
defaults:
  - /lorenz63_default
  - _self_

model:
  model_type: tweedie
  hidden_channels: [32, 64, 128]
  K_inner: 1
training:
  stage1:
    epochs: 300
    lr: 0.001
    gradient_clip_val: 10.0
  stage2:
    epochs: 200
    lr: 0.001
    gradient_clip_val: 1.0
data:
  train_mix: cs2
  randomize_params: false
